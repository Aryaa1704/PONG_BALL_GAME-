<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap");

    :root {
      --bg: #111318;
      --panel: #191c24;
      --panel-light: #202530;
      --text: #f5f7fa;
      --muted: #9aa3b2;
      --accent: #ffcd4d;
      --player: #6ee7b7;
      --computer: #fb7185;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(110, 231, 183, 0.12), transparent 28rem),
        radial-gradient(circle at 85% 80%, rgba(251, 113, 133, 0.12), transparent 30rem),
        var(--bg);
      font-family: "Space Grotesk", sans-serif;
    }

    .game-shell {
      width: min(100%, 980px);
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(2.4rem, 7vw, 5.5rem);
      line-height: 0.85;
      letter-spacing: -0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      max-width: 330px;
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: right;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      margin-bottom: 14px;
      padding: 16px 20px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
    }

    .score {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .score:last-child {
      justify-content: end;
    }

    .score strong {
      font-size: 2rem;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .score-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .player-dot {
      background: var(--player);
      box-shadow: 0 0 16px var(--player);
    }

    .computer-dot {
      background: var(--computer);
      box-shadow: 0 0 16px var(--computer);
    }

    .status {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-align: center;
      text-transform: uppercase;
    }

    .board-wrap {
      position: relative;
      overflow: hidden;
      padding: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      background:
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        #0d0f14;
      background-size: 32px 32px;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 10px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(13, 15, 20, 0.7);
      backdrop-filter: blur(8px);
      transition: opacity 180ms ease;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-content {
      padding: 24px;
      text-align: center;
    }

    .overlay h2 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: clamp(1.8rem, 5vw, 3rem);
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }

    .overlay p {
      margin: 0 0 20px;
      color: var(--muted);
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 22px;
      color: #161616;
      background: var(--accent);
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      transition: transform 150ms ease, filter 150ms ease;
    }

    button:hover {
      filter: brightness(1.08);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .controls kbd {
      padding: 4px 8px;
      color: var(--text);
      background: var(--panel-light);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.75rem;
    }

    @media (max-width: 620px) {
      body {
        padding: 14px;
      }

      header {
        display: block;
      }

      .subtitle {
        margin-top: 12px;
        text-align: left;
      }

      .scoreboard {
        gap: 10px;
        padding: 13px;
      }

      .score {
        gap: 7px;
        font-size: 0.68rem;
      }

      .score strong {
        font-size: 1.5rem;
      }

      .status {
        font-size: 0.62rem;
      }

      .controls {
        align-items: start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>Pong</h1>
      <p class="subtitle">
        A minimalist rally against the machine. First player to 7 points wins.
      </p>
    </header>

    <section class="scoreboard" aria-label="Game score">
      <div class="score">
        <span class="score-dot player-dot"></span>
        You <strong id="playerScore">0</strong>
      </div>
      <div class="status" id="status">Press space to start</div>
      <div class="score">
        <strong id="computerScore">0</strong> CPU
        <span class="score-dot computer-dot"></span>
      </div>
    </section>

    <section class="board-wrap">
      <canvas id="game" aria-label="Pong game board"></canvas>

      <div class="overlay" id="overlay">
        <div class="overlay-content">
          <h2 id="overlayTitle">Ready?</h2>
          <p id="overlayText">Move with your mouse, touch, or the W/S keys.</p>
          <button id="startButton">Start game</button>
        </div>
      </div>
    </section>

    <div class="controls">
      <span><kbd>W</kbd> <kbd>S</kbd> or mouse/touch to move</span>
      <span><kbd>Space</kbd> pause / resume</span>
    </div>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const overlay = document.querySelector("#overlay");
    const overlayTitle = document.querySelector("#overlayTitle");
    const overlayText = document.querySelector("#overlayText");
    const startButton = document.querySelector("#startButton");
    const statusText = document.querySelector("#status");
    const playerScoreText = document.querySelector("#playerScore");
    const computerScoreText = document.querySelector("#computerScore");

    const WINNING_SCORE = 7;
    const colors = {
      player: "#6ee7b7",
      computer: "#fb7185",
      ball: "#ffcd4d",
      text: "#f5f7fa",
      muted: "rgba(245, 247, 250, 0.25)"
    };

    let width = 960;
    let height = 540;
    let lastTime = 0;
    let animationFrame;
    let running = false;
    let paused = false;
    let playerScore = 0;
    let computerScore = 0;
    let keys = {};

    const player = {
      x: 28,
      y: 220,
      width: 12,
      height: 100,
      speed: 560
    };

    const computer = {
      x: 920,
      y: 220,
      width: 12,
      height: 100,
      speed: 410
    };

    const ball = {
      x: 480,
      y: 270,
      radius: 9,
      speed: 430,
      vx: 430,
      vy: 180
    };

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;

      width = 960;
      height = 540;
      canvas.width = width * ratio;
      canvas.height = height * ratio;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

      player.x = 28;
      computer.x = width - 40;
      player.height = height * 0.19;
      computer.height = height * 0.19;

      if (!running) {
        player.y = height / 2 - player.height / 2;
        computer.y = player.y;
        ball.x = width / 2;
        ball.y = height / 2;
      }
    }

    function resetBall(direction = 1) {
      ball.x = width / 2;
      ball.y = height / 2;

      const angle = (Math.random() * 0.8 - 0.4);
      ball.speed = 430;
      ball.vx = Math.cos(angle) * ball.speed * direction;
      ball.vy = Math.sin(angle) * ball.speed;
    }

    function resetMatch() {
      playerScore = 0;
      computerScore = 0;
      playerScoreText.textContent = playerScore;
      computerScoreText.textContent = computerScore;
      player.y = height / 2 - player.height / 2;
      computer.y = player.y;
      resetBall(Math.random() > 0.5 ? 1 : -1);
    }

    function startGame() {
      resetMatch();
      running = true;
      paused = false;
      overlay.classList.add("hidden");
      statusText.textContent = "In play";
      lastTime = performance.now();
      cancelAnimationFrame(animationFrame);
      animationFrame = requestAnimationFrame(gameLoop);
    }

    function endGame(winner) {
      running = false;
      overlayTitle.textContent = winner === "player" ? "You win" : "CPU wins";
      overlayText.textContent = `${playerScore} - ${computerScore}. Play another rally?`;
      startButton.textContent = "Play again";
      overlay.classList.remove("hidden");
      statusText.textContent = "Match complete";
    }

    function togglePause() {
      if (!running) return;

      paused = !paused;
      overlay.classList.toggle("hidden", !paused);
      overlayTitle.textContent = "Paused";
      overlayText.textContent = "Press space or the button to continue.";
      startButton.textContent = "Resume";
      statusText.textContent = paused ? "Paused" : "In play";

      if (!paused) {
        lastTime = performance.now();
        animationFrame = requestAnimationFrame(gameLoop);
      }
    }

    function movePlayer(targetY) {
      player.y = Math.max(0, Math.min(height - player.height, targetY - player.height / 2));
    }

    function update(delta) {
      if (keys.w || keys.ArrowUp) player.y -= player.speed * delta;
      if (keys.s || keys.ArrowDown) player.y += player.speed * delta;

      player.y = Math.max(0, Math.min(height - player.height, player.y));

      const computerCenter = computer.y + computer.height / 2;
      const trackingError = ball.y - computerCenter;
      computer.y += Math.sign(trackingError) * Math.min(Math.abs(trackingError), computer.speed * delta);
      computer.y = Math.max(0, Math.min(height - computer.height, computer.y));

      ball.x += ball.vx * delta;
      ball.y += ball.vy * delta;

      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= height) {
        ball.vy *= -1;
        ball.y = Math.max(ball.radius, Math.min(height - ball.radius, ball.y));
      }

      const hitsPlayer =
        ball.x - ball.radius <= player.x + player.width &&
        ball.x > player.x &&
        ball.y >= player.y &&
        ball.y <= player.y + player.height;

      const hitsComputer =
        ball.x + ball.radius >= computer.x &&
        ball.x < computer.x + computer.width &&
        ball.y >= computer.y &&
        ball.y <= computer.y + computer.height;

      if (hitsPlayer || hitsComputer) {
        const paddle = hitsPlayer ? player : computer;
        const relativeHit = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
        const direction = hitsPlayer ? 1 : -1;

        ball.speed = Math.min(ball.speed + 26, 850);
        ball.vx = Math.cos(relativeHit * 0.9) * ball.speed * direction;
        ball.vy = Math.sin(relativeHit * 0.9) * ball.speed;
        ball.x = hitsPlayer
          ? player.x + player.width + ball.radius
          : computer.x - ball.radius;
      }

      if (ball.x < -ball.radius) {
        computerScore++;
        computerScoreText.textContent = computerScore;
        if (computerScore >= WINNING_SCORE) return endGame("computer");
        resetBall(1);
      }

      if (ball.x > width + ball.radius) {
        playerScore++;
        playerScoreText.textContent = playerScore;
        if (playerScore >= WINNING_SCORE) return endGame("player");
        resetBall(-1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, width, height);

      ctx.setLineDash([12, 18]);
      ctx.strokeStyle = colors.muted;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(width / 2, 0);
      ctx.lineTo(width / 2, height);
      ctx.stroke();
      ctx.setLineDash([]);

      drawPaddle(player, colors.player);
      drawPaddle(computer, colors.computer);

      ctx.fillStyle = colors.ball;
      ctx.shadowColor = colors.ball;
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawPaddle(paddle, color) {
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 18;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function gameLoop(timestamp) {
      if (!running || paused) return;

      const delta = Math.min((timestamp - lastTime) / 1000, 0.033);
      lastTime = timestamp;

      update(delta);
      draw();
      animationFrame = requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", resizeCanvas);

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", " "].includes(event.key)) event.preventDefault();

      if (event.key === " ") {
        if (!running) startGame();
        else togglePause();
      }

      keys[event.key] = true;
      keys[event.key.toLowerCase()] = true;
    });

    window.addEventListener("keyup", (event) => {
      keys[event.key] = false;
      keys[event.key.toLowerCase()] = false;
    });

    canvas.addEventListener("pointermove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const scaleY = height / rect.height;
      movePlayer((event.clientY - rect.top) * scaleY);
    });

    canvas.addEventListener("pointerdown", (event) => {
      canvas.setPointerCapture(event.pointerId);
      if (!running) startGame();
    });

    startButton.addEventListener("click", () => {
      if (paused) togglePause();
      else startGame();
    });

    resizeCanvas();
    draw();
  </script>
</body>
</html>
